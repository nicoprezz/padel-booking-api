spring.application.name=padel-booking-api

# Perfil "local": carga también application-local.properties (no versionado, en .gitignore),
# donde está la contraseña de la base de datos.
spring.profiles.active=local

# Conexión a MySQL (contenedor padel-mysql). El driver y el dialecto se deducen de la URL.
spring.datasource.url=jdbc:mysql://localhost:3306/padel
spring.datasource.username=padel
# spring.datasource.password -> en application-local.properties

# JPA / Hibernate
# El esquema lo crean las migraciones de Flyway (db/migration/V*__*.sql), que se ejecutan
# al arrancar, antes que Hibernate. "validate": Hibernate no toca las tablas, solo
# comprueba que encajan con las entidades; si no, la app no arranca (→ DECISIONES.md #017).
spring.jpa.hibernate.ddl-auto=validate